<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo Admin</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2330;--mu:#6b7686;--bd:#e3e8ef;--ok:#16a34a;--no:#dc2626;--ac:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192031;--tx:#e8ecf4;--mu:#93a0b5;--bd:#2a3550}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 20px;font-weight:700;font-size:18px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;justify-content:space-between}
header small{font-weight:400;color:var(--mu)}
main{max-width:1100px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px;margin-top:4px}.stat span{color:var(--mu);font-size:12px}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:20px;overflow:hidden}
h2{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--bd)}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
td.e{text-align:center;color:var(--mu);padding:24px}
button{border:0;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;font-weight:600;margin-right:6px}
.a{background:var(--ok)}.r{background:var(--no)}button:disabled{opacity:.5}
</style></head><body>
<header><span>🎲 Ludo Admin</span><span><a href="/admin/api/backup" style="color:var(--ac);font-weight:600;margin-right:12px">💾 Download backup</a><small id="upd"></small></span></header>
<main>
<div class="stats" id="stats"></div>
<section><h2>⚠️ Disputed Matches (stakes on hold)</h2><div class="w"><table><thead><tr><th>Match</th><th>Players</th><th>Stake each</th><th>Details</th><th>Action</th></tr></thead><tbody id="dsp"></tbody></table></div></section>
<section><h2>Pending Deposits</h2><div class="w"><table><thead><tr><th>ID</th><th>User</th><th>Method</th><th>Sender #</th><th>TrxID</th><th>Amount</th><th>Time</th><th>Action</th></tr></thead><tbody id="dep"></tbody></table></div></section>
<section><h2>Pending Withdrawals</h2><div class="w"><table><thead><tr><th>ID</th><th>User</th><th>Method</th><th>Recipient #</th><th>Amount</th><th>Time</th><th>Action</th></tr></thead><tbody id="wd"></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id),tk=n=>'৳'+Number(n||0).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ft=s=>{const d=new Date(String(s).replace(' ','T')+'Z');return isNaN(d)?esc(s):esc(d.toLocaleString())};
async function api(url,opt){opt=opt||{};opt.headers={...(opt.headers||{}),'X-Requested-With':'ludo-admin'};const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.statusText);return r.json()}
function btns(id,ok){return `<button class="a" data-id="${id}" data-act="approve">${ok}</button><button class="r" data-id="${id}" data-act="reject">Reject</button>`}
function rows(list,cols,ok){return list.length?list.map(t=>`<tr>${cols(t)}<td>${btns(t.id,ok)}</td></tr>`).join(''):`<tr><td class="e" colspan="9">Nothing pending</td></tr>`}
async function load(){
  try{
    const [o,d,w,x]=await Promise.all([api('/admin/api/overview'),api('/admin/api/pending/deposit'),api('/admin/api/pending/withdraw'),api('/admin/api/disputes')]);
    const S=[['Total Platform Volume',tk(o.totalVolume)],['Platform Commission ('+(o.feePct||5)+'%)',tk(o.totalCommission)],['Active Games',o.activeGames],['Completed Matches',o.completedMatches],['Users',o.users],['User Wallet Liabilities',tk(o.userBalances)],['Disputed Matches',o.disputes],['Pending Deposits',o.pendingDeposits],['Pending Withdrawals',o.pendingWithdrawals]];
    $('stats').innerHTML=S.map(([a,b])=>`<div class="stat"><span>${a}</span><b>${esc(b)}</b></div>`).join('');
    $('dep').innerHTML=rows(d,t=>`<td>${t.id}</td><td>${esc(t.username)}</td><td>${esc(t.method)}</td><td>${esc(t.account_number)}</td><td><b>${esc(t.trx_id)}</b></td><td>${tk(t.amount)}</td><td>${ft(t.timestamp)}</td>`,'Approve');
    $('wd').innerHTML=rows(w,t=>`<td>${t.id}</td><td>${esc(t.username)}</td><td>${esc(t.method)}</td><td>${esc(t.account_number)}</td><td>${tk(t.amount)}</td><td>${ft(t.timestamp)}</td>`,'Mark as Paid');
    $('dsp').innerHTML=x.length?x.map(m=>`<tr><td>#${m.id}</td><td>P1: <b>${esc(m.p1)}</b><br>P2: <b>${esc(m.p2)}</b></td><td>${tk(m.bet_amount)}</td><td><small>${esc(m.note)}</small></td><td><button class="a" data-room="${esc(m.room_id)}" data-d="p1">P1 wins</button><button class="a" data-room="${esc(m.room_id)}" data-d="p2">P2 wins</button><button class="r" data-room="${esc(m.room_id)}" data-d="refund">Refund both</button></td></tr>`).join(''):'<tr><td class="e" colspan="5">No disputes</td></tr>';
    $('upd').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){$('upd').textContent='Error: '+e.message}
}
document.addEventListener('click',async e=>{
  const d=e.target.closest('button[data-room]');
  if(d){if(!confirm('Resolve dispute: '+d.textContent+'?'))return;d.disabled=true;try{await api(`/admin/api/dispute/${d.dataset.room}/${d.dataset.d}`,{method:'POST'})}catch(err){alert(err.message)}return load()}
  const b=e.target.closest('button[data-id]');if(!b)return;
  const verb=b.dataset.act==='approve'?b.textContent:'reject';
  if(!confirm(`${verb} transaction #${b.dataset.id}?`))return;
  b.disabled=true;
  try{await api(`/admin/api/tx/${b.dataset.id}/${b.dataset.act}`,{method:'POST'})}catch(err){alert(err.message)}
  load();
});
load();setInterval(load,5000);
</script></body></html>
